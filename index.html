<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacaciones Metal 2026 | Supabase Edition</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .fc-day-sun, .fc-day-sat { background-color: #fff1f2 !important; }
        .festivo-nacional { background-color: #fee2e2 !important; color: #b91c1c !important; font-weight: bold; }
        .festivo-local { background-color: #dcfce7 !important; color: #15803d !important; font-weight: bold; }
        .sidebar { height: 100vh; overflow-y: auto; }
        #mainApp { display: none; }
        .active-user { border-left: 4px solid #2563eb; background: #eff6ff; }
        .fc-event-vacation {
            background-color: #10b981 !important; 
            border: none !important;
            color: white !important;
            font-size: 0.75rem;
            padding: 2px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Acceso Supabase</h1>
            <p class="text-slate-500 mb-6 text-sm">Introduce tus credenciales de administrador.</p>
            <div class="space-y-4">
                <input type="text" id="user" placeholder="Usuario" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="password" id="pass" placeholder="Contraseña" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="handleLogin()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold hover:bg-emerald-700 transition">Entrar</button>
                <p id="error" class="text-red-500 text-xs hidden text-center">Credenciales incorrectas.</p>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div id="mainApp" class="grid grid-cols-1 md:grid-cols-[300px_1fr] h-screen">
        <aside class="sidebar bg-white border-r p-6 flex flex-col">
            <div class="mb-8 flex justify-between items-center">
                <h2 class="text-xl font-bold text-emerald-700">Metal 2026</h2>
                <button onclick="fetchData()" class="p-1 hover:bg-slate-100 rounded" title="Refrescar">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
            <div class="mb-6">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-4">Plantilla</label>
                <div id="userList" class="space-y-2"></div>
            </div>
        </aside>

        <main class="overflow-y-auto bg-white">
            <header class="p-6 border-b flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 id="currentUserTitle" class="font-bold text-lg text-slate-800">Selecciona un empleado</h3>
                <div class="flex gap-2">
                    <button onclick="calendar.changeView('multiMonthYear')" class="px-3 py-1 bg-slate-100 rounded text-xs hover:bg-slate-200">Año</button>
                    <button onclick="calendar.changeView('dayGridMonth')" class="px-3 py-1 bg-slate-100 rounded text-xs hover:bg-slate-200">Mes</button>
                </div>
            </header>
            <div class="p-6">
                <div id="calendar" class="max-w-4xl mx-auto mb-8"></div>
                <div id="registrosContainer" class="hidden">
                    <h4 class="font-bold text-slate-700 mb-4 text-sm uppercase">Asignaciones de <span id="spanUser"></span></h4>
                    <div class="border rounded-xl overflow-hidden shadow-sm">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-500 text-[10px] uppercase">
                                <tr>
                                    <th class="p-4">Periodo</th>
                                    <th class="p-4 text-center">Días</th>
                                    <th class="p-4 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[100]">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm mx-4">
            <h4 class="text-lg font-bold mb-1">Confirmar Registro</h4>
            <p id="rangeText" class="text-sm text-slate-500 mb-6"></p>
            <div class="grid grid-cols-1 gap-3">
                <button id="btnFull" onclick="saveVacation(1.0)" class="p-4 border rounded-xl hover:bg-emerald-50 text-left transition group border-slate-200">
                    <div class="font-bold text-emerald-600">Jornada Completa (1.0)</div>
                    <div class="text-[10px] text-slate-400">Descuenta días enteros laborables</div>
                </button>
                <button id="btnHalf" onclick="saveVacation(0.5)" class="p-4 border rounded-xl hover:bg-amber-50 text-left transition border-slate-200">
                    <div class="font-bold text-amber-600">Media Jornada (0.5)</div>
                    <div class="text-[10px] text-slate-400">Cada día cuenta como medio día</div>
                </button>
            </div>
            <button onclick="closeModal()" class="w-full mt-4 text-slate-400 text-sm hover:text-slate-600 transition">Cerrar</button>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const SUPABASE_URL = "https://ibsztkfrkumibvllxhqn.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlic3p0a2Zya3VtaWJ2bGx4aHFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NzYxMTYsImV4cCI6MjA4NzQ1MjExNn0.igRwNr_mNV4NVWlo_DzpFZ3jbnMPvqmhlX7FRbs4bKs"; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let calendar, selectedRange, currentUser, vacacionesData = [];

        const employees = ["Raúl Villegas", "Igor Santamaría", "Adrian Blanco", "Nacho Galán", "Jesus Lopez", "Luis Sanchez", "Jorge M."];
        const festivos = {
            nacionales: ["2026-01-01", "2026-01-06", "2026-04-02", "2026-04-03", "2026-05-01", "2026-07-28", "2026-08-15", "2026-10-12", "2026-12-07", "2026-12-08", "2026-12-24", "2026-12-25", "2026-12-31"],
            locales: ["2026-08-17", "2026-09-15", "2026-09-16"]
        };

        function handleLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === 'admin' && p === 'metal2026') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'grid';
                initApp();
            } else {
                document.getElementById('error').classList.remove('hidden');
            }
        }

        async function initApp() {
            await fetchData();
            renderUserList();
            initCalendar();
        }

        async function fetchData() {
            const { data, error } = await supabaseClient
                .from('vacaciones_2026')
                .select('*')
                .order('fecha_inicio', { ascending: true });
            
            if(!error) {
                vacacionesData = data || [];
                if(calendar) updateCalendarEvents();
                renderUserList();
                if(currentUser) renderTable();
            } else {
                console.error("Fetch Error:", error);
            }
        }

        function updateCalendarEvents() {
            if(!calendar) return;
            calendar.removeAllEvents();
            
            // Si hay un usuario seleccionado, mostramos sus eventos
            const filtered = currentUser 
                ? vacacionesData.filter(v => v.empleado === currentUser)
                : vacacionesData;

            const events = filtered.map(v => ({
                id: v.id,
                title: `${Number(v.dias).toFixed(1)}d - ${v.empleado}`,
                start: v.fecha_inicio,
                end: v.fecha_fin,
                allDay: true,
                className: 'fc-event-vacation'
            }));
            
            calendar.addEventSource(events);
        }

        function renderUserList() {
            const list = document.getElementById('userList');
            list.innerHTML = employees.map(name => {
                const used = vacacionesData
                    .filter(v => v.empleado === name)
                    .reduce((sum, v) => sum + (parseFloat(v.dias) || 0), 0);
                const remaining = 25 - used;
                return `
                    <div onclick="selectUser('${name}')" class="p-3 rounded-xl cursor-pointer hover:bg-slate-50 transition ${currentUser === name ? 'active-user shadow-sm' : ''}">
                        <div class="flex justify-between items-center">
                            <span class="font-semibold text-slate-700 text-sm">${name}</span>
                            <span class="text-[10px] font-bold ${remaining < 5 ? 'text-red-500' : 'text-emerald-600'}">${remaining.toFixed(1)}d</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectUser(name) {
            currentUser = name;
            document.getElementById('currentUserTitle').innerText = name;
            document.getElementById('spanUser').innerText = name;
            document.getElementById('registrosContainer').classList.remove('hidden');
            renderUserList();
            renderTable();
            updateCalendarEvents();
        }

        function initCalendar() {
            const calEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calEl, {
                initialView: 'multiMonthYear',
                initialDate: '2026-01-01',
                locale: 'es',
                firstDay: 1,
                selectable: true,
                headerToolbar: false,
                dayCellDidMount: (info) => {
                    const dateStr = info.date.toISOString().split('T')[0];
                    if(festivos.nacionales.includes(dateStr)) info.el.classList.add('festivo-nacional');
                    if(festivos.local && festivos.locales.includes(dateStr)) info.el.classList.add('festivo-local');
                },
                select: (info) => {
                    if(!currentUser) {
                        alert("Por favor, selecciona un empleado primero.");
                        calendar.unselect();
                        return;
                    }
                    selectedRange = info;
                    document.getElementById('rangeText').innerText = `${info.startStr} al ${info.endStr}`;
                    document.getElementById('modal').style.display = 'flex';
                }
            });
            calendar.render();
            updateCalendarEvents();
        }

        async function saveVacation(factor) {
            document.getElementById('btnFull').disabled = true;
            document.getElementById('btnHalf').disabled = true;

            let count = 0;
            let curr = new Date(selectedRange.start);
            const end = new Date(selectedRange.end);
            
            while(curr < end) {
                const d = curr.getDay();
                const s = curr.toISOString().split('T')[0];
                const isFeriado = festivos.nacionales.includes(s) || (festivos.locales && festivos.locales.includes(s));
                // Lunes a Viernes y no feriado
                if(d !== 0 && d !== 6 && !isFeriado) count += factor;
                curr.setDate(curr.getDate() + 1);
            }

            if(count <= 0) {
                alert("La selección no incluye días laborables.");
                closeModal();
                return;
            }

            const payload = { 
                empleado: currentUser, 
                fecha_inicio: selectedRange.startStr, 
                fecha_fin: selectedRange.endStr, 
                dias: count 
            };

            const { error } = await supabaseClient
                .from('vacaciones_2026')
                .insert([payload]);

            if(error) {
                alert("Error al guardar: " + error.message);
                console.error(error);
            } else {
                await fetchData();
            }

            document.getElementById('btnFull').disabled = false;
            document.getElementById('btnHalf').disabled = false;
            closeModal();
        }

        function renderTable() {
            const filtered = vacacionesData.filter(v => v.empleado === currentUser);
            const body = document.getElementById('tableBody');
            body.innerHTML = filtered.length ? filtered.map(v => `
                <tr class="border-b last:border-0 hover:bg-slate-50 transition">
                    <td class="p-4 text-slate-600 font-medium">${v.fecha_inicio} <span class="text-slate-300 mx-1">→</span> ${v.fecha_fin}</td>
                    <td class="p-4 text-center font-bold text-emerald-600">${parseFloat(v.dias).toFixed(1)}</td>
                    <td class="p-4 text-right">
                        <button onclick="deleteRecord('${v.id}')" class="text-red-400 hover:text-red-600 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </td>
                </tr>
            `).join('') : '<tr><td colspan="3" class="p-8 text-center text-slate-400 italic">No hay registros para este empleado</td></tr>';
        }

        async function deleteRecord(id) {
            if(!confirm("¿Estás seguro de eliminar este registro?")) return;
            const { error } = await supabaseClient
                .from('vacaciones_2026')
                .delete()
                .eq('id', id);

            if(!error) {
                await fetchData();
            } else {
                alert("Error al eliminar: " + error.message);
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            if(calendar) calendar.unselect();
        }
    </script>
</body>
</html>
