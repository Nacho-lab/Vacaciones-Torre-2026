<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adarsa Torrelavega | Gestión 2026</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; touch-action: manipulation; }
        .fc-day-sun, .fc-day-sat { background-color: #fff1f2 !important; }
        .fc-daygrid-day-frame { min-height: 100px !important; }
        .custom-event-pill {
            display: flex; align-items: center; padding: 2px 6px; border-radius: 6px;
            color: white; font-size: 10px; font-weight: 800; margin-bottom: 2px;
            width: 100%; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            line-height: 1.2; overflow: hidden;
        }
        .event-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .btn-delete {
            width: 14px; height: 14px; background: rgba(0, 0, 0, 0.2); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 8px;
            cursor: pointer; flex-shrink: 0; margin-left: 2px;
        }
        .fc-event { background: transparent !important; border: none !important; padding: 0 2px !important; }
        #sidebar { transition: transform 0.3s ease; z-index: 100; }
        @media (max-width: 768px) {
            #sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
        }
        .type-btn { @apply flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-slate-100 bg-white cursor-pointer transition-all hover:border-blue-200; }
        .type-btn-active { @apply border-blue-600 bg-blue-50 ring-4 ring-blue-100; }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(200%); z-index: 2000; transition: transform 0.3s; }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast" class="bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl font-bold text-sm">
        <span id="toastMsg"></span>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] w-full max-w-md text-center shadow-2xl">
            <div class="mb-8">
                <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tighter leading-tight">Gestión de vacaciones</h1>
                <h2 class="text-xl font-bold text-blue-600 uppercase tracking-widest mt-1">Adarsa Torrelavega</h2>
            </div>
            
            <div class="space-y-4">
                <div class="text-left">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 mb-1 block">Usuario</label>
                    <input type="text" id="userInput" autocomplete="off" aria-autocomplete="none" class="w-full px-6 py-4 bg-slate-100 rounded-xl font-bold outline-none focus:ring-4 focus:ring-blue-100 transition-all" placeholder="Nombre de usuario">
                </div>
                
                <div class="text-left">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 mb-1 block">Contraseña</label>
                    <input type="password" id="pass" autocomplete="new-password" aria-autocomplete="none" class="w-full px-6 py-4 bg-slate-100 rounded-xl font-bold outline-none focus:ring-4 focus:ring-blue-100 transition-all" placeholder="••••••••">
                </div>
                
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-5 rounded-xl font-black uppercase tracking-widest hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 active:scale-[0.98] mt-4">Entrar al sistema</button>
            </div>
            
            <p class="mt-8 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Acceso restringido · 2026</p>
        </div>
    </div>

    <div id="mainApp" class="hidden h-screen flex flex-col md:flex-row overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-white border-r p-6 flex flex-col w-[300px] shrink-0 overflow-y-auto shadow-sm">
            <!-- Header Logo -->
            <div class="mb-8 px-2">
                <h2 class="text-2xl font-black italic leading-none text-slate-900 tracking-tighter">Adarsa</h2>
                <p class="text-[11px] font-black text-blue-600 uppercase tracking-[0.2em] mt-1.5 opacity-80">Torrelavega</p>
            </div>

            <div class="flex-1 space-y-6">
                <div>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 px-2">Administración</h3>
                    <div id="list-admin" class="space-y-1"></div>
                </div>
                <div>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 px-2">Taller</h3>
                    <div id="list-taller" class="space-y-1"></div>
                </div>
            </div>

            <button onclick="toggleModoFestivos()" class="mt-6 w-full py-4 bg-red-50 text-red-600 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-red-100 transition-colors">Configurar Festivos</button>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <header class="bg-white border-b px-6 py-4 flex justify-between items-center shrink-0">
                <button onclick="toggleSidebar()" class="md:hidden p-2 bg-slate-100 rounded-lg">☰</button>
                <div class="flex items-center gap-4">
                    <button onclick="navYear(-1)" class="font-bold p-1 text-slate-400 hover:text-blue-600 transition-colors">«</button>
                    <span id="displayYear" class="font-black text-xl italic text-slate-800">2026</span>
                    <button onclick="navYear(1)" class="font-bold p-1 text-slate-400 hover:text-blue-600 transition-colors">»</button>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <p id="currentUserTitle" class="font-black text-sm text-blue-600 leading-none">Seleccionar Recurso</p>
                        <p id="currentStatus" class="text-[9px] text-slate-400 font-bold uppercase mt-1">Gestión Activa</p>
                    </div>
                    <button id="btnAnalysis" onclick="openAnalysis()" class="hidden p-3 bg-slate-900 text-white rounded-xl hover:bg-slate-800 transition-all active:scale-95 shadow-md">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M18 20V4M6 20V16"/></svg>
                    </button>
                </div>
            </header>
            
            <div class="flex-1 p-4 overflow-y-auto">
                <div id="calendar" class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200"></div>
            </div>
        </main>
    </div>

    <!-- Modals (Registro y Análisis) omitidos por brevedad pero funcionales en el script -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[150] p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl animate-in zoom-in-95 duration-200">
            <h4 class="text-center font-black text-slate-900 mb-6 text-xl" id="modalTitle">Registrar ausencia</h4>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div onclick="selectType('vacaciones')" id="btn-vacaciones" class="type-btn text-xs font-black">🏖️ VACACIONES</div>
                <div onclick="selectType('baja')" id="btn-baja" class="type-btn text-xs font-black">🤒 BAJA</div>
                <div onclick="selectType('curso')" id="btn-curso" class="type-btn text-xs font-black">📚 CURSO</div>
                <div onclick="selectType('otros')" id="btn-otros" class="type-btn text-xs font-black">📝 OTROS</div>
            </div>
            <div id="confirmActions" class="hidden space-y-3">
                <button onclick="confirmSave(1.0)" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black text-xs uppercase hover:bg-blue-700 transition-all shadow-lg shadow-blue-100">Día Completo (1.0)</button>
                <button onclick="confirmSave(0.5)" class="w-full py-4 border-2 border-slate-100 rounded-xl font-black text-slate-500 text-xs uppercase hover:bg-slate-50 transition-all">Medio Día (0.5)</button>
            </div>
            <button onclick="closeModal()" class="w-full mt-4 text-slate-400 font-bold text-[10px] uppercase hover:text-slate-600 tracking-widest">Cancelar</button>
        </div>
    </div>

    <div id="modalAnalysis" class="fixed inset-0 bg-slate-900/90 hidden items-center justify-center z-[200] p-4 backdrop-blur-md">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-3xl relative shadow-2xl animate-in fade-in zoom-in-95 duration-300">
            <button onclick="closeAnalysis()" class="absolute top-6 right-6 font-bold text-slate-400 hover:text-slate-900 text-xl transition-colors">✕</button>
            <h2 id="analysisUser" class="text-2xl font-black italic mb-6 text-slate-900">Analizando...</h2>
            <div class="h-80 w-full mb-8"><canvas id="analysisChart"></canvas></div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4" id="analysisStats"></div>
            <div class="mt-8 pt-6 border-t flex justify-between items-end">
                <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Vacaciones Consumidas</p><p id="vacaSum" class="text-4xl font-black text-blue-600">0.0</p></div>
                <div class="text-right"><p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Disponibles (Cupo 25.5)</p><p id="restSum" class="text-4xl font-black text-emerald-500">25.5</p></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ibsztkfrkumibvllxhqn.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlic3p0a2Zya3VtaWJ2bGx4aHFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NzYxMTYsImV4cCI6MjA4NzQ1MjExNn0.igRwNr_mNV4NVWlo_DzpFZ3jbnMPvqmhlX7FRbs4bKs"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const TABLE_NAME = "vacaciones_2026"; 
        const MAX_VACATIONS = 25.5;

        let calendar, currentUser = null, selectedInfo, currentYear = 2026, rawData = [], selectedType = null, modoFestivos = false, chart = null;

        const employees = {
            "Raúl Villegas": { color: "#10b981", grupo: "admin" },
            "Igor Santamaría": { color: "#3b82f6", grupo: "admin" },
            "Adrián Gómez": { color: "#f59e0b", grupo: "admin" },
            "Nacho Galán": { color: "#8b5cf6", grupo: "admin" },
            "Jesús Fernández": { color: "#f97316", grupo: "taller" },
            "Luis Portilla": { color: "#06b6d4", grupo: "taller" },
            "Jorge Barreda": { color: "#f43f5e", grupo: "taller" }
        };

        const types = {
            'vacaciones': { label: 'Vacaciones', emoji: '🏖️', color: '#3b82f6' },
            'baja': { label: 'Bajas', emoji: '🤒', color: '#f43f5e' },
            'curso': { label: 'Cursos', emoji: '📚', color: '#8b5cf6' },
            'otros': { label: 'Otros', emoji: '📝', color: '#64748b' },
            'festivo': { label: 'Festivo', emoji: '🚩', color: '#ef4444' }
        };

        function showToast(m) { 
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = m; 
            t.classList.add('show'); 
            setTimeout(() => t.classList.remove('show'), 2500); 
        }
        
        function handleLogin() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('pass').value;
            // Se mantiene la lógica de contraseña solicitada, usuario informativo
            if(pass === "metal2026" && user.trim() !== "") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
                init();
            } else if (user.trim() === "") {
                showToast("👤 Introduce un usuario");
            } else {
                showToast("❌ Credenciales incorrectas");
            }
        }

        async function init() {
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: window.innerWidth < 768 ? 'dayGridMonth' : 'multiMonthYear',
                initialDate: `${currentYear}-01-01`,
                locale: 'es', 
                firstDay: 1, 
                selectable: true,
                unselectAuto: false,
                headerToolbar: window.innerWidth < 768 ? { left: 'prev,next', center: 'title', right: '' } : false,
                eventContent: (arg) => {
                    let div = document.createElement('div');
                    div.className = 'custom-event-pill';
                    div.style.backgroundColor = arg.event.backgroundColor;
                    div.innerHTML = `<span class="event-label">${arg.event.title}</span>`;
                    let del = document.createElement('div');
                    del.className = 'btn-delete'; del.innerText = '✕';
                    del.onclick = (e) => { e.stopPropagation(); deleteEntry(arg.event.id); };
                    div.appendChild(del);
                    return { domNodes: [div] };
                },
                select: (info) => {
                    selectedInfo = info;
                    if(modoFestivos) { selectedType = 'festivo'; confirmSave(0); } 
                    else if(currentUser) { resetModal(); document.getElementById('modal').style.display = 'flex'; } 
                    else { showToast("👤 Selecciona un empleado primero"); calendar.unselect(); }
                }
            });
            calendar.render();
            await loadData();
        }

        async function loadData() {
            const { data, error } = await supabaseClient.from(TABLE_NAME).select('*');
            if(error) { showToast("Error cargando datos"); return; }
            rawData = data || [];
            refreshUI();
        }

        function refreshUI() {
            calendar.removeAllEvents();
            const events = rawData.map(d => ({
                id: d.id,
                title: d.empleado === 'FESTIVO' ? 'FESTIVO' : d.empleado.split(' ')[0],
                start: d.fecha_inicio,
                backgroundColor: d.empleado === 'FESTIVO' ? '#ef4444' : (employees[d.empleado]?.color || '#94a3b8'),
                allDay: true
            }));
            calendar.addEventSource(events);

            const adminBox = document.getElementById('list-admin');
            const tallerBox = document.getElementById('list-taller');
            adminBox.innerHTML = ''; tallerBox.innerHTML = '';

            Object.keys(employees).forEach(name => {
                const totalVaca = rawData
                    .filter(r => r.empleado === name && r.tipo?.toLowerCase() === 'vacaciones')
                    .reduce((acc, curr) => acc + parseFloat(curr.dias || 0), 0);
                const isActive = currentUser === name;
                const percent = Math.min((totalVaca / MAX_VACATIONS) * 100, 100);
                const color = employees[name].color;
                const cardHtml = `<div onclick="selectUser('${name}')" class="p-3 rounded-xl cursor-pointer transition-all border-2 mb-1.5 ${isActive ? 'bg-blue-50 border-blue-400 shadow-md ring-2 ring-blue-50' : 'bg-white border-transparent hover:border-slate-200 hover:shadow-sm'}"><div class="flex justify-between text-[11px] font-black mb-1.5"><span class="truncate pr-2 ${isActive ? 'text-blue-900' : 'text-slate-700'}">${name}</span><span class="${totalVaca > MAX_VACATIONS ? 'text-red-500 bg-red-50' : 'text-slate-500 bg-slate-100'} px-2 py-0.5 rounded-full font-bold">${totalVaca.toFixed(1)} / ${MAX_VACATIONS}</span></div><div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden"><div class="h-full transition-all duration-700 ease-out rounded-full" style="width: ${percent}%; background-color: ${color}; box-shadow: 0 0 8px ${color}44"></div></div></div>`;
                if(employees[name].grupo === 'admin') adminBox.innerHTML += cardHtml; else tallerBox.innerHTML += cardHtml;
            });
        }

        async function confirmSave(val) {
            let start = new Date(selectedInfo.start); const end = new Date(selectedInfo.end); const batch = [];
            while(start < end) {
                if(modoFestivos || (start.getDay() !== 0 && start.getDay() !== 6)) {
                    batch.push({ empleado: modoFestivos ? 'FESTIVO' : currentUser, fecha_inicio: start.toISOString().split('T')[0], fecha_fin: start.toISOString().split('T')[0], tipo: selectedType, dias: val });
                }
                start.setDate(start.getDate() + 1);
            }
            if(batch.length > 0) {
                const { error } = await supabaseClient.from(TABLE_NAME).insert(batch);
                if(!error) { await loadData(); showToast(`✅ Registrado correctamente`); }
            } else showToast("⚠️ No se puede registrar en fin de semana");
            closeModal();
        }

        async function deleteEntry(id) {
            const { error } = await supabaseClient.from(TABLE_NAME).delete().eq('id', id);
            if(!error) { await loadData(); showToast("🗑️ Registro eliminado"); }
        }

        function selectUser(n) { currentUser = n; modoFestivos = false; document.getElementById('currentUserTitle').innerText = n; document.getElementById('btnAnalysis').classList.remove('hidden'); refreshUI(); }
        function toggleModoFestivos() { modoFestivos = true; currentUser = null; document.getElementById('currentUserTitle').innerText = "FESTIVOS"; document.getElementById('btnAnalysis').classList.add('hidden'); refreshUI(); }
        function selectType(t) { selectedType = t; document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('type-btn-active')); document.getElementById('btn-'+t).classList.add('type-btn-active'); document.getElementById('confirmActions').classList.remove('hidden'); }
        function resetModal() { selectedType = null; document.getElementById('confirmActions').classList.add('hidden'); document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('type-btn-active')); }
        function closeModal() { document.getElementById('modal').style.display = 'none'; calendar.unselect(); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function navYear(v) { currentYear += v; document.getElementById('displayYear').innerText = currentYear; calendar.gotoDate(`${currentYear}-01-01`); loadData(); }

        function openAnalysis() {
            if(!currentUser) return; document.getElementById('modalAnalysis').style.display = 'flex'; document.getElementById('analysisUser').innerText = currentUser;
            const categoryKeys = ['vacaciones', 'baja', 'curso', 'otros'];
            const stats = categoryKeys.map(t => rawData.filter(r => r.empleado === currentUser && r.tipo?.toLowerCase() === t).reduce((a,c) => a + parseFloat(c.dias || 0), 0));
            const ctx = document.getElementById('analysisChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, { type: 'bar', data: { labels: categoryKeys.map(k => types[k].label), datasets: [{ data: stats, backgroundColor: categoryKeys.map(k => types[k].color + 'CC'), borderColor: categoryKeys.map(k => types[k].color), borderWidth: 2, borderRadius: 12, barThickness: 50 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: Math.max(MAX_VACATIONS, ...stats) + 2 }, x: { grid: { display: false } } } } });
            const container = document.getElementById('analysisStats'); container.innerHTML = '';
            categoryKeys.forEach((k, i) => { container.innerHTML += `<div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl"><p class="text-[10px] font-black text-slate-400 uppercase mb-1">${types[k].emoji} ${types[k].label}</p><p class="text-xl font-black text-slate-900">${stats[i].toFixed(1)} <span class="text-[10px] text-slate-400">DÍAS</span></p></div>`; });
            document.getElementById('vacaSum').innerText = stats[0].toFixed(1); document.getElementById('restSum').innerText = (MAX_VACATIONS - stats[0]).toFixed(1);
        }
        function closeAnalysis() { document.getElementById('modalAnalysis').style.display = 'none'; }
    </script>
</body>
</html>
